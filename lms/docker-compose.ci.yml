version: "3.9"
services:
  mysql:
    image: mysql:8
    container_name: ken-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: ken_db
    ports:
      - "3306:3306"

  backend:
    image: arun586/ken-backend:latest
    container_name: ken-backend
    restart: always
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: ken_db
      PORT: 3000
    ports:
      - "3001:3000"

  frontend:
    image: arun586/ken-frontend:latest
    container_name: ken-frontend
    restart: always
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports:
      - "80:3000"
